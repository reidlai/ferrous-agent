[package]
name = "ferrous-agent"
version = "0.1.0"
edition = "2021"
authors = ["FerrousCX Contributors"]
description = "Pure-Rust Pluggable Multi-Provider LLM Orchestration Engine via rig-core"
license = "MIT OR Apache-2.0"

[lib]
name = "ferrous_agent"
path = "src/lib.rs"

[[bin]]
name = "ferrous-agent"
path = "src/main.rs"

[dependencies]
rig-core = { version = "0.46", features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1.2"
uuid = { version = "1.10", features = ["v7", "serde"] }
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
regex = "1.11"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-rustls", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"
arrow = "60.1"
parquet = { version = "60.1", features = ["arrow"] }
jsonschema = { version = "0.61", default-features = false }
axum = "0.7"
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
